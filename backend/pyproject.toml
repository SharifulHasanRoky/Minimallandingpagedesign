[project]
name = "coworker-os-backend"
version = "0.1.0"
description = "Free, self-hosted AI Coworker OS - backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.3",
  "python-multipart>=0.0.12",
  "cryptography>=43.0.0",
  "chromadb>=0.5.15",
  "sentence-transformers>=3.2.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "PyYAML>=6.0.2",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
