name: local-filesystem
description: |
  Read-only filesystem access scoped to the workspace. Writes are gated by
  the approval system. Useful for the coding agent.
transport: stdio
command: ["python", "-m", "local_fs_mcp"]
status: builtin
tools:
  - name: fs.read
    description: Read a UTF-8 text file relative to the workspace.
    input_schema:
      type: object
      properties:
        path: { type: string }
      required: [path]
  - name: fs.list
    description: List files in a directory relative to the workspace.
    input_schema:
      type: object
      properties:
        path: { type: string }
      required: [path]
  - name: fs.write
    description: Write a file (REQUIRES APPROVAL - effect_class=mutate_internal).
    input_schema:
      type: object
      properties:
        path:    { type: string }
        content: { type: string }
      required: [path, content]
