# Coworker OS - one-command self-host.
#
#   docker compose up -d
#
# Default profile launches: backend, frontend, postgres, redis, chroma.
# Ollama is in the `ollama` profile (requires more disk + optionally a GPU):
#
#   docker compose --profile ollama up -d
#
# Everything works WITHOUT external services - the backend defaults to
# embedded SQLite + embedded Chroma. Postgres/Redis/Chroma server are here
# for users who want to scale beyond a single machine.

name: coworker-os

services:
  backend:
    build: ./backend
    image: coworker-os/backend:dev
    container_name: coworker-backend
    restart: unless-stopped
    environment:
      COWORKER_ENV: ${COWORKER_ENV:-dev}
      COWORKER_HOST: 0.0.0.0
      COWORKER_PORT: 8000
      COWORKER_LOG_LEVEL: ${COWORKER_LOG_LEVEL:-INFO}
      COWORKER_OLLAMA_BASE_URL: ${COWORKER_OLLAMA_BASE_URL:-http://ollama:11434}
      COWORKER_GEMINI_API_KEY: ${COWORKER_GEMINI_API_KEY:-}
      COWORKER_OPENROUTER_API_KEY: ${COWORKER_OPENROUTER_API_KEY:-}
      COWORKER_DEEPSEEK_API_KEY: ${COWORKER_DEEPSEEK_API_KEY:-}
      COWORKER_HUGGINGFACE_API_KEY: ${COWORKER_HUGGINGFACE_API_KEY:-}
      COWORKER_MASTER_KEY: ${COWORKER_MASTER_KEY:-}
      COWORKER_CORS_ORIGINS: ${COWORKER_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persist SQLite, Chroma, encrypted secrets and any user-installed MCPs.
      - coworker_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: node:20-alpine
    container_name: coworker-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm run dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # ── Optional infra (used when you outgrow embedded SQLite/Chroma) ─────
  postgres:
    image: postgres:16-alpine
    container_name: coworker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coworker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coworker}
      POSTGRES_DB: ${POSTGRES_DB:-coworker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coworker-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: coworker-chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"

  # ── Ollama: local LLMs (free, always available) ───────────────────────
  # Started only when --profile ollama is passed:
  #   docker compose --profile ollama up -d
  # After it boots, pull the default models:
  #   docker exec -it coworker-ollama ollama pull qwen2.5:3b
  #   docker exec -it coworker-ollama ollama pull qwen2.5-coder:7b
  ollama:
    image: ollama/ollama:latest
    container_name: coworker-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  coworker_data:
  frontend_node_modules:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_models:
